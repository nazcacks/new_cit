const Btn = ({ children, onClick, variant="primary", size="md", disabled=false, className="" }) => {
  const base = "inline-flex items-center justify-center font-medium rounded-lg transition-all duration-200 active:scale-95";
  const sizes = { sm:"px-3 py-1.5 text-xs", md:"px-4 py-2 text-sm", lg:"px-6 py-3 text-base" };
  const variants = {
    primary: "bg-gradient-to-r from-indigo-600 to-blue-600 text-white shadow-md shadow-indigo-500/30 hover:shadow-lg hover:shadow-indigo-500/40 hover:-translate-y-0.5",
    secondary:"bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 hover:border-slate-400 shadow-sm",
    danger:  "bg-gradient-to-r from-rose-500 to-red-600 text-white shadow-md shadow-rose-500/30 hover:shadow-lg hover:shadow-rose-500/40 hover:-translate-y-0.5",
    ghost:   "bg-transparent text-slate-600 hover:bg-slate-100 hover:text-slate-900",
    success: "bg-gradient-to-r from-emerald-500 to-teal-600 text-white shadow-md shadow-emerald-500/30 hover:shadow-lg hover:shadow-emerald-500/40 hover:-translate-y-0.5",
  };
  return <button disabled={disabled}
    className={`${base} ${sizes[size]} ${variants[variant]} ${disabled?'opacity-50 cursor-not-allowed transform-none shadow-none':''} ${className}`}
    onClick={onClick}>{children}</button>;
};

   ============================================================ */
const Login = ({ onLogin }) => {
  const [step, setStep] = useState("creds"); // creds | otp
  const [id, setId] = useState("ksc");
  const [pw, setPw] = useState("demo");
  const [otp, setOtp] = useState("");
  const submitCreds = (e) => { e.preventDefault(); setStep("otp"); };
  const submitOtp   = (e) => { e.preventDefault(); if (otp.length === 6) onLogin(); };

  return (
    <div className="min-h-screen flex items-center justify-center bg-[conic-gradient(at_bottom_left,_var(--tw-gradient-stops))] from-slate-900 via-indigo-900 to-slate-900 relative overflow-hidden">

      <div className="absolute top-1/3 right-1/4 w-96 h-96 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>
      
      <div className="glass shadow-2xl rounded-2xl p-10 w-[420px] relative z-10 fade-in border border-white/20">
        <div className="text-center mb-8">
          <div className="text-4xl mb-3 inline-block p-4 rounded-2xl bg-white/10 shadow-inner backdrop-blur-md">📊</div>
          <h1 className="text-2xl font-bold text-white tracking-tight mt-2">CIT System</h1>
          <p className="text-sm text-indigo-200 mt-1">법인세 세무조정계산서 시스템 v1.0</p>
        </div>

        {step === "creds" && (
          <form className="space-y-5 fade-in" style={{ animationDelay: '100ms' }} onSubmit={submitCreds}>
            <div>
              <label className="block text-xs font-medium text-indigo-100 mb-1.5 ml-1">회사 코드</label>
              <input className="w-full bg-white/10 border border-indigo-200/20 rounded-xl px-4 py-3 text-sm text-white placeholder-indigo-200/50 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white/20 transition-all" defaultValue="EY001" />
            </div>
            <div>
              <label className="block text-xs font-medium text-indigo-100 mb-1.5 ml-1">아이디</label>
              <input className="w-full bg-white/10 border border-indigo-200/20 rounded-xl px-4 py-3 text-sm text-white placeholder-indigo-200/50 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white/20 transition-all" value={id} onChange={e=>setId(e.target.value)} />
            </div>
            <div>
              <label className="block text-xs font-medium text-indigo-100 mb-1.5 ml-1">비밀번호</label>
              <input type="password" className="w-full bg-white/10 border border-indigo-200/20 rounded-xl px-4 py-3 text-sm text-white placeholder-indigo-200/50 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white/20 transition-all" value={pw} onChange={e=>setPw(e.target.value)} />
            </div>
            <div className="pt-2">
              <button className="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-400 hover:to-purple-500 text-white font-semibold rounded-xl px-4 py-3 shadow-lg shadow-indigo-500/30 hover:shadow-indigo-500/50 hover:-translate-y-0.5 transition-all duration-200">로그인</button>
            </div>
            <p className="text-xs text-indigo-200/60 text-center mt-4">데모용 — 어떤 값을 입력해도 진행됩니다</p>
          </form>
        )}

        {step === "otp" && (
          <form className="space-y-5 fade-in" onSubmit={submitOtp}>
            <div className="bg-white/10 border border-amber-500/30 text-amber-100 text-xs p-4 rounded-xl shadow-inner backdrop-blur-sm">2단계 인증 (TOTP) — 인증 앱 6자리 코드를 입력하세요</div>
            <input
              className="w-full bg-white/10 border border-indigo-200/20 rounded-xl px-4 py-4 text-center text-3xl tracking-[0.5em] text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white/20 transition-all"
              value={otp} onChange={e=>setOtp(e.target.value.replace(/\D/g,"").slice(0,6))}
              placeholder="000000" autoFocus />
            <div className="pt-2">
              <button disabled={otp.length!==6} className="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-400 hover:to-purple-500 disabled:from-slate-600 disabled:to-slate-700 text-white font-semibold rounded-xl px-4 py-3 shadow-lg shadow-indigo-500/30 transition-all duration-200 disabled:shadow-none disabled:transform-none">인증 확인</button>

          </form>
        )}

  );

const Stepper = ({ active }) => {
  const { current, navigate } = useApp();
  // 단순 진행 임계: progress 기반
  const reachedIdx = current.status === "FILED" ? 7
                   : current.status === "APPROVED" ? 5
                   : current.status === "IN_REVIEW" ? 3
                   : Math.max(1, Math.floor((current.progress||0)/15));
  const activeIdx = WORKSPACE_STEPS.findIndex(s=>s.id===active);

  return (
    <div className="bg-white border-b border-slate-200 px-6 py-3">
      <ol className="flex items-center gap-1 text-xs">
        {WORKSPACE_STEPS.map((s, i) => {
          const done = i < reachedIdx;
          const cur = i === activeIdx;
          return (
            <Fragment key={s.id}>
              <li>
                <button
                  onClick={()=>navigate("ws-"+s.id)}
                  className={`flex items-center gap-1 px-2 py-1 rounded
                    ${cur ? "bg-indigo-600 text-white":""}
                    ${done && !cur ? "text-emerald-700":""}
                    ${!cur && !done ? "text-slate-500":""}`}>
                  <span className={`inline-flex items-center justify-center w-5 h-5 rounded-full text-[10px]
                    ${cur ? "bg-white text-indigo-600":""}
                    ${done && !cur ? "bg-emerald-200 text-emerald-800":""}
                    ${!cur && !done ? "bg-slate-200":""}`}>{s.no}</span>
                  <span className="font-medium">{s.name}</span>
                  {done && !cur && <span className="text-emerald-600">✓</span>}
                </button>
              </li>
              {i < WORKSPACE_STEPS.length-1 && <li className="flex-1 h-px step-line"></li>}
            </Fragment>
          );
        })}
      </ol>
    </div>
  );
};

  const [customerFilter, setCustomerFilter] = useState("ALL");
  const [workScopeFilter, setWorkScopeFilter] = useState("ALL");
  const [statusFilter, setStatusFilter] = useState("ALL");
  const [roleFilter, setRoleFilter] = useState("ALL");
  const [showNew, setShowNew] = useState(false);
  const [newUser, setNewUser] = useState(emptyNewUser);
  const [draft, setDraft] = useState(() => normalizeUserTargetScopes(initialUsers[2]));
  const [audit, setAudit] = useState([
    { at:"2026-05-14 10:32", actor:"ksc", action:"로그인 성공", target:"10.0.1.23" },
    { at:"2026-04-12 14:01", actor:"tadmin", action:"ksc 역할 변경", target:"TAX_EXPERT 부여" },
    { at:"2026-02-01 09:18", actor:"ksc", action:"2FA 등록", target:"TOTP" },
  ]);

  const selected = users.find(u => u.id === selectedId) || users[0];
  const cloneWorkScopes = (workScopes = {}) =>
    Object.fromEntries(Object.entries(workScopes).map(([customerId, scopes]) => [customerId, [...scopes]]));
  const allWorkScopesByCustomer = (customers) =>
    Object.fromEntries(customers.map(customer => [customer.id, [...targetWorkScopesForCustomer(customer.id)]]));
  useEffect(() => {
    if (selected) {
      setDraft({ ...selected, roles: [...selected.roles], customerIds: [...(selected.customerIds || [])], workScopes: cloneWorkScopes(selected.workScopes) });
    }
  }, [selectedId, users]);

  const tenantName = (tenantId) => DUMMY_TENANTS.find(tenant => tenant.id === tenantId)?.name || tenantId;
  const tenantCustomers = (tenantId) => DUMMY_CUSTOMERS.filter(customer => customer.tenantId === tenantId);
  const customerName = (customerId) => DUMMY_CUSTOMERS.find(customer => customer.id === customerId)?.name || customerId;
  const visibleCustomers = tenantFilter === "ALL" ? DUMMY_CUSTOMERS : tenantCustomers(tenantFilter);
  const draftCustomers = tenantCustomers(draft.tenantId || "ey001");
  const newUserCustomers = tenantCustomers(newUser.tenantId);
  const customerSummary = (user) => {
    const ids = user.customerIds || [];
    const total = tenantCustomers(user.tenantId).length;
    if (!ids.length) return "미지정";
    if (ids.length === total) return `전체 ${ids.length}개`;
    return `${ids.length}개`;
  };
  const workScopeSummary = (user) => {
    const workScopes = user.workScopes || {};
    const count = (user.customerIds || []).reduce((sum, customerId) => sum + ((workScopes[customerId] || []).length), 0);
    return count ? `${count}개 업무` : "업무 미지정";
  };

  const addAudit = (action, target = selectedId) => {
    setAudit(items => [
      { at:"방금", actor:"tadmin", action, target },
      ...items.slice(0, 7),
    ]);
  };
  const filtered = users.filter(user => {
    const keyword = query.trim().toLowerCase();
    const matchesKeyword = !keyword ||
      user.id.toLowerCase().includes(keyword) ||
      user.name.toLowerCase().includes(keyword) ||
      user.email.toLowerCase().includes(keyword) ||
      user.dept.toLowerCase().includes(keyword);
    const matchesStatus = statusFilter === "ALL" || user.status === statusFilter;
    const matchesRole = roleFilter === "ALL" || user.roles.includes(roleFilter);
    const matchesTenant = tenantFilter === "ALL" || user.tenantId === tenantFilter;
    const matchesCustomer = customerFilter === "ALL" || (user.customerIds || []).includes(Number(customerFilter));
    const scopeCustomerIds = customerFilter === "ALL" ? (user.customerIds || []) : [Number(customerFilter)];
    const matchesWorkScope = workScopeFilter === "ALL" || scopeCustomerIds.some(customerId => ((user.workScopes || {})[customerId] || []).includes(workScopeFilter));
    return matchesKeyword && matchesStatus && matchesRole && matchesTenant && matchesCustomer && matchesWorkScope;
  });
  const toggleRole = (role) => {
    setDraft(current => {
      const hasRole = current.roles.includes(role);
      const roles = hasRole ? current.roles.filter(item => item !== role) : [...current.roles, role];
      return { ...current, roles: roles.length ? roles : [role] };
    });
  };
  const toggleNewRole = (role) => {
    setNewUser(current => {
      const hasRole = current.roles.includes(role);
      const roles = hasRole ? current.roles.filter(item => item !== role) : [...current.roles, role];
      return { ...current, roles: roles.length ? roles : [role] };
    });
  };
  const toggleDraftCustomer = (customerId) => {
    setDraft(current => {
      const ids = current.customerIds || [];
      const selected = ids.includes(customerId);
      const customerIds = selected ? ids.filter(id => id !== customerId) : [...ids, customerId];
      const workScopes = { ...(current.workScopes || {}) };
      if (selected) delete workScopes[customerId];
      else workScopes[customerId] = [...targetWorkScopesForCustomer(customerId)];
      return { ...current, customerIds, workScopes };
    });
  };
  const toggleNewCustomer = (customerId) => {
    setNewUser(current => {
      const ids = current.customerIds || [];
      const selected = ids.includes(customerId);
      const customerIds = selected ? ids.filter(id => id !== customerId) : [...ids, customerId];
      const workScopes = { ...(current.workScopes || {}) };
      if (selected) delete workScopes[customerId];
      else workScopes[customerId] = [...targetWorkScopesForCustomer(customerId)];
      return { ...current, customerIds, workScopes };
    });
  };
  const toggleDraftWorkScope = (customerId, scopeCode) => {
    if (!targetWorkScopesForCustomer(customerId).includes(scopeCode)) return;
    setDraft(current => {
      const workScopes = { ...(current.workScopes || {}) };
      const scopes = workScopes[customerId] || [];
      workScopes[customerId] = scopes.includes(scopeCode) ? scopes.filter(code => code !== scopeCode) : [...scopes, scopeCode];
      return { ...current, workScopes };
    });
  };
  const toggleNewWorkScope = (customerId, scopeCode) => {
    if (!targetWorkScopesForCustomer(customerId).includes(scopeCode)) return;
    setNewUser(current => {
      const workScopes = { ...(current.workScopes || {}) };
      const scopes = workScopes[customerId] || [];
      workScopes[customerId] = scopes.includes(scopeCode) ? scopes.filter(code => code !== scopeCode) : [...scopes, scopeCode];
      return { ...current, workScopes };
    });
  };
  const saveDraft = () => {
    setUsers(items => items.map(user => user.id === selectedId ? { ...user, ...draft, roles: [...draft.roles], customerIds: [...(draft.customerIds || [])], workScopes: cloneWorkScopes(draft.workScopes) } : user));
    addAudit("사용자 정보 저장", selectedId);
  };
  const updateStatus = (status) => {
    const lockedAt = status === "LOCKED" ? "방금" : "";
    setUsers(items => items.map(user => user.id === selectedId ? { ...user, status, lockedAt } : user));
    addAudit(status === "LOCKED" ? "계정 강제 잠금" : "계정 잠금 해제", selectedId);
  };
  const resetTwoFA = () => {
    setUsers(items => items.map(user => user.id === selectedId ? { ...user, twoFA:false, twoFAResetAt:"방금" } : user));
    addAudit("2FA 시크릿 리셋", selectedId);
  };
  const resetPassword = () => addAudit("임시 비밀번호 발급", selectedId);
  const withdrawUser = () => {
    setUsers(items => items.map(user => user.id === selectedId ? { ...user, status:"WITHDRAWN" } : user));
    addAudit("사용자 퇴사 처리", selectedId);
  };
  const createUser = () => {
    const id = newUser.id.trim();
    if (!id || !newUser.name.trim() || users.some(user => user.id === id)) {
      return;
    }
    const created = {
      id,
      name: newUser.name.trim(),
      email: newUser.email.trim(),
      dept: newUser.dept.trim() || "미지정",
      tenantId: newUser.tenantId,
      customerIds: [...newUser.customerIds],
      workScopes: cloneWorkScopes(newUser.workScopes),
      roles: [...newUser.roles],
      status: newUser.status,
      twoFA: newUser.twoFA,
      lockedAt: "",
      lastLogin: "-",
    };
    setUsers(items => [created, ...items]);
    setSelectedId(created.id);
    setNewUser({ ...emptyNewUser, roles:[...emptyNewUser.roles], customerIds:[], workScopes:{} });
    setShowNew(false);
    addAudit("신규 사용자 등록", created.id);
  };

  return (
    <div className="p-6 space-y-4">
      <div className="flex items-center justify-between">
        <div>
          <h1 className="text-xl font-bold text-slate-800">5-B 사용자 관리</h1>
          <p className="text-sm text-slate-500 mt-1">사용자를 테넌트에 소속시키고, 고객사별 대상 업무 범위까지 사용자별로 지정합니다. 역할별 기능 권한은 5-C, 담당 고객사 예외 권한은 5-E에서 별도로 관리합니다.</p>
        </div>
        <div className="flex gap-2">
          <Btn variant="secondary" size="sm">Excel 내보내기</Btn>
          <Btn size="sm" onClick={()=>setShowNew(true)}>+ 신규 사용자</Btn>
        </div>
      </div>

      <div className="grid grid-cols-4 gap-3">
        {DUMMY_TENANTS.map(tenant => {
          const tenantUsers = users.filter(user => user.tenantId === tenant.id);
          const tenantAssignedCustomers = new Set(tenantUsers.flatMap(user => user.customerIds || []));
          const tenantWorkScopeCount = tenantUsers.reduce((sum, user) => sum + (user.customerIds || []).reduce((inner, customerId) => inner + (((user.workScopes || {})[customerId] || []).length), 0), 0);
          return (
            <Card key={tenant.id}>
              <div className="text-xs text-slate-500">{tenant.name}</div>
              <div className="flex items-end justify-between mt-1">
                <div className="text-2xl font-bold text-slate-800">{tenantUsers.length}</div>
                <Badge color={tenant.status === "ACTIVE" ? "bg-emerald-100 text-emerald-700" : "bg-amber-100 text-amber-700"}>{tenant.status}</Badge>
              </div>
              <div className="text-xs text-slate-400 mt-1">사용자 {tenantUsers.length}명 · 고객사 {tenantAssignedCustomers.size}개 · 업무 {tenantWorkScopeCount}개</div>
            </Card>
          );
        })}
      </div>

      <div className="grid grid-cols-12 gap-4">
        <Card title="사용자 목록" className="col-span-8">
          <div className="grid grid-cols-12 gap-2 mb-3">
            <input
              className="col-span-3 border border-slate-300 rounded px-3 py-1.5 text-sm"
              placeholder="이름 / ID / 이메일 / 부서 검색"
              value={query}
              onChange={event => setQuery(event.target.value)}
            />
            <select className="col-span-3 border rounded px-2 py-1 text-sm" value={tenantFilter} onChange={event => { setTenantFilter(event.target.value); setCustomerFilter("ALL"); }}>
              <option value="ALL">전체 테넌트</option>
              {DUMMY_TENANTS.map(tenant => <option key={tenant.id} value={tenant.id}>{tenant.name}</option>)}
            </select>
            <select className="col-span-3 border rounded px-2 py-1 text-sm" value={customerFilter} onChange={event => setCustomerFilter(event.target.value)}>
              <option value="ALL">전체 고객사</option>
              {visibleCustomers.map(customer => <option key={customer.id} value={customer.id}>{customer.name}</option>)}
            </select>
            <select className="col-span-3 border rounded px-2 py-1 text-sm" value={workScopeFilter} onChange={event => setWorkScopeFilter(event.target.value)}>
              <option value="ALL">전체 대상 업무</option>
              {WORK_SCOPE_OPTIONS.map(scope => <option key={scope.code} value={scope.code}>{scope.label}</option>)}
            </select>
            <select className="col-span-2 border rounded px-2 py-1 text-sm" value={statusFilter} onChange={event => setStatusFilter(event.target.value)}>
              <option value="ALL">전체 상태</option>
              <option value="ACTIVE">활성</option>
              <option value="LOCKED">잠금</option>
              <option value="WITHDRAWN">퇴사</option>
            </select>
            <select className="col-span-3 border rounded px-2 py-1 text-sm" value={roleFilter} onChange={event => setRoleFilter(event.target.value)}>
              <option value="ALL">전체 역할</option>
              {ROLE_OPTIONS.map(role => <option key={role} value={role}>{role}</option>)}
            </select>
            <div className="col-span-7 text-xs text-slate-500 flex items-center">테넌트, 고객사, 대상 업무 범위를 조합해 사용자를 필터링합니다.</div>
          </div>
          <table className="w-full text-sm">
            <thead className="text-xs text-slate-500 border-b">
              <tr>
                <th className="text-left py-1">사용자</th>
                <th className="text-left">테넌트</th>
                <th className="text-left">고객사 권한</th>
                <th className="text-left">업무 범위</th>
                <th className="text-left">역할</th>
                <th>상태</th>
                <th>2FA</th>
                <th>최근 접속</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(user => (
                <tr key={user.id}
                    className={`border-b cursor-pointer hover:bg-slate-50 ${selectedId===user.id?"bg-indigo-50":""}`}
                    onClick={()=>setSelectedId(user.id)}>
                  <td className="py-2">
                    <div className="font-medium">{user.name}</div>
                    <div className="text-xs text-slate-500 font-mono">{user.id} · {user.email}</div>
                    <div className="text-xs text-slate-400">{user.dept}</div>
                  </td>
                  <td>
                    <div className="font-medium text-xs">{tenantName(user.tenantId)}</div>
                    <div className="text-[11px] text-slate-400 font-mono">{user.tenantId}</div>
                  </td>
                  <td>
                    <Badge color={(user.customerIds || []).length ? "bg-sky-100 text-sky-700" : "bg-rose-100 text-rose-700"}>{customerSummary(user)}</Badge>
                  </td>
                  <td>
                    <Badge color="bg-indigo-100 text-indigo-700">{workScopeSummary(user)}</Badge>
                  </td>
                  <td>
                    <div className="flex flex-wrap gap-1">
                      {user.roles.map(role => <Badge key={role}>{role}</Badge>)}
                    </div>
                  </td>
                  <td className="text-center"><Badge color={STATUS_CLASS[user.status]}>{user.status}</Badge></td>
                  <td className="text-center">{user.twoFA ? "사용" : "미등록"}</td>
                  <td className="text-xs text-slate-500">{user.lastLogin}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="text-xs text-slate-500 mt-2">표시 {filtered.length}명 / 전체 {users.length}명</div>
        </Card>

        <Card title={`사용자 편집 - ${selected?.name || ""}`} className="col-span-4">
          {selected && (
            <div className="space-y-3 text-sm">
              <div>
                <label className="block text-xs text-slate-500">사용자 ID</label>
                <input className="w-full border rounded px-2 py-1 bg-slate-50" value={draft.id || ""} readOnly />
              </div>
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-xs text-slate-500">이름</label>
                  <input className="w-full border rounded px-2 py-1" value={draft.name || ""} onChange={event=>setDraft({...draft, name:event.target.value})} />
                </div>
                <div>
                  <label className="block text-xs text-slate-500">부서</label>
                  <input className="w-full border rounded px-2 py-1" value={draft.dept || ""} onChange={event=>setDraft({...draft, dept:event.target.value})} />
                </div>
              </div>
              <div>
                <label className="block text-xs text-slate-500">이메일</label>
                <input className="w-full border rounded px-2 py-1" value={draft.email || ""} onChange={event=>setDraft({...draft, email:event.target.value})} />
              </div>
              <div>
                <label className="block text-xs text-slate-500">소속 테넌트</label>
                <select className="w-full border rounded px-2 py-1" value={draft.tenantId || "ey001"} onChange={event=>setDraft({...draft, tenantId:event.target.value, customerIds:[], workScopes:{}})}>
                  {DUMMY_TENANTS.map(tenant => <option key={tenant.id} value={tenant.id}>{tenant.name}</option>)}
                </select>
              </div>
              <div className="border rounded p-3 bg-slate-50">
                <div className="flex items-center justify-between mb-2">
                  <label className="text-xs font-semibold text-slate-600">고객사 접근 범위</label>
                  <div className="flex gap-1">
                    <button type="button" className="text-[11px] text-indigo-600" onClick={()=>setDraft({...draft, customerIds:draftCustomers.map(customer => customer.id), workScopes:allWorkScopesByCustomer(draftCustomers)})}>전체 선택</button>
                    <button type="button" className="text-[11px] text-slate-500" onClick={()=>setDraft({...draft, customerIds:[], workScopes:{}})}>해제</button>
                  </div>
                </div>
                <div className="max-h-28 overflow-y-auto scroll-thin space-y-1">
                  {draftCustomers.map(customer => (
                    <label key={customer.id} className="flex items-center justify-between gap-2 text-xs">
                      <span><input type="checkbox" className="mr-1" checked={(draft.customerIds || []).includes(customer.id)} onChange={()=>toggleDraftCustomer(customer.id)} />{customer.name}</span>
                      <span className="text-slate-400 font-mono">{customer.code}</span>
                    </label>
                  ))}
                  {!draftCustomers.length && <div className="text-xs text-slate-400">선택한 테넌트의 고객사가 없습니다.</div>}
                </div>
                <div className="text-[11px] text-slate-500 mt-2">선택된 고객사 {(draft.customerIds || []).length}개 · 고객사 권한은 소속 테넌트 안에서만 적용됩니다.</div>
                {(draft.customerIds || []).length > 0 && (
                  <div className="border-t mt-3 pt-3 space-y-2">
                    <div className="text-xs font-semibold text-slate-600">고객사별 대상 업무</div>
                    {(draft.customerIds || []).map(customerId => {
                      const customer = draftCustomers.find(item => item.id === customerId);
                      if (!customer) return null;
                      return (
                        <div key={customerId} className="bg-white border rounded p-2">
                          <div className="flex justify-between text-xs mb-1">
                            <span className="font-medium">{customer.name}</span>
                            <span className="text-slate-400 font-mono">{customer.code}</span>
                          </div>
                          <div className="text-[11px] text-slate-500 mb-1">고객사 대상 업무: {targetWorkScopesForCustomer(customerId).map(workScopeLabel).join(", ")}</div>
                          <div className="grid grid-cols-2 gap-1">
                            {WORK_SCOPE_OPTIONS.filter(scope => targetWorkScopesForCustomer(customerId).includes(scope.code)).map(scope => (
                              <label key={scope.code} className="text-[11px]">
                                <input type="checkbox" className="mr-1" checked={((draft.workScopes || {})[customerId] || []).includes(scope.code)} onChange={()=>toggleDraftWorkScope(customerId, scope.code)} />{scope.label}
                              </label>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
              <div>
                <label className="block text-xs text-slate-500 mb-1">역할</label>
                <div className="flex flex-wrap gap-1">
                  {ROLE_OPTIONS.map(role => (
                    <label key={role} className={`text-xs px-2 py-1 rounded border cursor-pointer ${draft.roles?.includes(role) ? "bg-indigo-100 border-indigo-400 text-indigo-700" : "border-slate-300 text-slate-600"}`}>
                      <input type="checkbox" className="mr-1" checked={draft.roles?.includes(role)} onChange={()=>toggleRole(role)} />{role}
                    </label>
                  ))}
                </div>
              </div>
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-xs text-slate-500">상태</label>
                  <select className="w-full border rounded px-2 py-1" value={draft.status || "ACTIVE"} onChange={event=>setDraft({...draft, status:event.target.value})}>
                    <option value="ACTIVE">활성</option>
                    <option value="LOCKED">잠금</option>
                    <option value="WITHDRAWN">퇴사</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs text-slate-500">2FA</label>
                  <label className="flex items-center gap-2 h-8"><input type="checkbox" checked={!!draft.twoFA} onChange={event=>setDraft({...draft, twoFA:event.target.checked})}/> 사용</label>
                </div>
              </div>
              <div className="border-t pt-3 grid grid-cols-2 gap-2">
                <Btn size="sm" variant="secondary" onClick={resetPassword}>비밀번호 초기화</Btn>
                <Btn size="sm" variant="secondary" onClick={resetTwoFA}>2FA 리셋</Btn>
                {selected.status === "LOCKED"
                  ? <Btn size="sm" variant="success" onClick={()=>updateStatus("ACTIVE")}>잠금 해제</Btn>
                  : <Btn size="sm" variant="secondary" onClick={()=>updateStatus("LOCKED")}>강제 잠금</Btn>}
                <Btn size="sm" variant="danger" onClick={withdrawUser}>퇴사 처리</Btn>
              </div>
              <div className="pt-2 flex justify-end gap-2">
                <Btn size="sm" variant="secondary" onClick={()=>setDraft({...selected, roles:[...selected.roles], customerIds:[...(selected.customerIds || [])], workScopes:cloneWorkScopes(selected.workScopes)})}>취소</Btn>
                <Btn size="sm" onClick={saveDraft}>저장</Btn>
              </div>
              <div className="text-xs text-slate-500">
                {selected.lockedAt ? `잠금 시각: ${selected.lockedAt}` : "잠금 이력 없음"}
                {selected.twoFAResetAt ? ` · 2FA 리셋: ${selected.twoFAResetAt}` : ""}
              </div>
            </div>
          )}
        </Card>
      </div>

      <Card title="사용자 관리 감사 이력">
        <table className="w-full text-sm">
          <thead className="text-xs text-slate-500 border-b"><tr><th className="text-left py-1">시각</th><th>관리자</th><th>행위</th><th>대상</th></tr></thead>
          <tbody>
            {audit.map((item, index) => (
              <tr key={`${item.at}-${index}`} className="border-b">
                <td className="py-1.5 text-xs text-slate-500">{item.at}</td>
                <td>{item.actor}</td>
                <td>{item.action}</td>
                <td className="font-mono text-xs">{item.target}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </Card>

      {showNew && (
        <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-50" onClick={()=>setShowNew(false)}>
          <div className="bg-white rounded-lg w-[720px] p-5" onClick={event=>event.stopPropagation()}>

/* ============================================================
   App Shell
   ============================================================ */
const Shell = () => {
  const { menuKey } = useApp();
  const wsFull = menuKey.startsWith("ws-");
  const route = {
    "dashboard": <Dashboard/>,
    "ws-start": <WorkStart/>,
    "ws-info":  <WorkInfo/>,
    "ws-adj":   <WorkAdj/>,
    "ws-form":  <WorkForm/>,
    "ws-val":   <WorkVal/>,
    "ws-appr":  <WorkAppr/>,
    "ws-print": <WorkPrint/>,
    "ws-file":  <WorkFile/>,
    "post-hist":<PostHist/>,
    "post-amend":<PostAmend/>,
    "rp-compare":<Reports menuKey={menuKey}/>,
    "rp-burden":<Reports menuKey={menuKey}/>,
    "rp-reserve":<Reports menuKey={menuKey}/>,
    "ad-tenant":   <AdminTenant/>,
    "ad-cust":      <AdminCust/>,
    "ad-user-list": <AdminUserList/>,
    "ad-role":      <AdminRolePerm/>,
    "ad-menu-fn":   <AdminMenuFunc/>,
    "ad-cacc":      <AdminCAcc/>,
    "ad-law":       <AdminLaw/>,
    "ad-form":      <AdminFormVer/>,
    "ad-audit":     <AdminAudit/>,
  }[menuKey] || <Dashboard/>;

  return (
    <div className="min-h-screen flex">
      <Sidebar/>
      <div className="flex-1 flex flex-col">
        <TopBar/>
        {wsFull
          ? <div className="flex-1 flex flex-col overflow-hidden">{route}</div>
          : <main className="flex-1 overflow-y-auto scroll-thin">{route}</main>}
      </div>
    </div>
  );
};

/* ============================================================
   루트
   ============================================================ */
const App = () => {
  const [authed, setAuthed] = useState(false);
  const [menuKey, setMenuKey] = useState("dashboard");
  const [current, setCurrent] = useState({});

  const navigate = (k) => setMenuKey(k);

  return (
    <AppCtx.Provider value={{ menuKey, navigate, current, setCurrent, logout:()=>{setAuthed(false); setCurrent({});} }}>
      {authed ? <Shell/> : <Login onLogin={()=>setAuthed(true)} />}
    </AppCtx.Provider>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
