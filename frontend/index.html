<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>법인세 세무조정계산서 시스템</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <section id="loginView" class="login-view">
      <form id="loginForm" class="login-panel">
        <div class="brand">
          <div class="brand-mark">CIT</div>
          <div>
            <strong data-i18n="app.title">법인세 세무조정계산서 시스템</strong>
            <span data-i18n="app.subtitle">법인세 신고 작업</span>
          </div>
        </div>
        <label><span data-i18n="auth.tenant">테넌트</span><input id="loginTenant" value="demo" list="tenantSuggestions" autocomplete="organization" /></label>
        <datalist id="tenantSuggestions"></datalist>
        <div class="login-tools">
          <button id="tenantSearchBtn" class="secondary-btn compact" type="button" data-i18n="tenant.search">테넌트 검색</button>
          <div id="recentTenants" class="recent-tenants"></div>
        </div>
        <label><span data-i18n="auth.loginId">로그인 ID</span><input id="loginId" value="admin" autocomplete="username" /></label>
        <label><span data-i18n="auth.password">비밀번호</span><input id="loginPassword" type="password" autocomplete="current-password" /></label>
        <label id="loginOtpWrap" class="hidden"><span data-i18n="auth.otp">인증 코드</span><input id="loginOtp" inputmode="numeric" autocomplete="one-time-code" /></label>
        <p id="loginOtpHelp" class="empty hidden" data-i18n="auth.otpHelp">OTP 앱의 6자리 코드를 입력하세요.</p>
        <button id="loginBtn" class="primary-btn" type="button" data-i18n="auth.login">로그인</button>
        <p id="loginMessage" class="login-message" aria-live="polite"></p>
      </form>
    </section>

    <div id="appView" class="app-shell hidden">
      <aside id="cwk-sidebar" class="sidebar">
        <div class="brand">
          <div class="brand-mark">CIT</div>
          <div>
            <strong data-i18n="app.title">법인세 세무조정계산서 시스템</strong>
            <span id="signedTenant">-</span>
          </div>
        </div>
        <nav id="moduleMenu" data-i18n-attr="aria-label:nav.workspace" aria-label="신고 작업 메뉴"></nav>
        <div id="contextBadge" class="context-badge"></div>
      </aside>

      <section class="app-main">
        <header id="cwk-topbar" class="topbar">
          <div>
            <p class="eyebrow" id="routeGroup">대시보드</p>
            <h1 id="routeTitle">개요</h1>
          </div>
          <div class="top-actions">
            <div id="tenantSwitcher" class="tenant-switcher"></div>
            <div id="stateBadge" class="state-badge"></div>
            <select id="languageSelect" class="language-select" data-i18n-attr="aria-label:language.select" aria-label="언어 선택">
              <option value="ko">한국어</option>
              <option value="en">English</option>
            </select>
            <div id="healthBadge" class="health-badge pending"><span></span><strong id="healthText" data-i18n="health.pending">확인 중</strong></div>
            <button id="logoutBtn" class="secondary-btn" type="button" data-i18n="auth.logout">로그아웃</button>
          </div>
        </header>
        <div id="lawBanner" class="law-banner hidden"></div>
        <div id="stepper" class="stepper"></div>
        <main id="cwk-route-outlet" class="route-outlet" aria-live="polite"></main>
      </section>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
