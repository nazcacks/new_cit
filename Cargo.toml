[package]
name = "cit-system"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Corporate Income Tax adjustment service with PostgreSQL persistence and e-filing jobs"
license = "UNLICENSED"

[lib]
name = "cit_system"
path = "src/lib.rs"

[[bin]]
name = "cit-system"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["json", "macros", "multipart"] }
base64 = "0.22"
calamine = "0.26"
chrono = { version = "0.4", features = ["clock", "serde"] }
csv = "1"
dotenvy = "0.15"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "migrate", "uuid"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
zip = "2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
